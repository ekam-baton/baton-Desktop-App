<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baton</title>
    <style>
      body {
        margin: 0;
        background: transparent;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .splash-container {
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #070B14 0%, #151A25 100%);
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        color: white;
        border: 1px solid rgba(255,255,255,0.05);
      }
      .logo {
        width: 120px;
        height: 120px;
        margin-bottom: 24px;
        border-radius: 20px;
        animation: pulse 2s infinite ease-in-out;
      }
      .title {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 2px;
      }
      .subtitle {
        font-size: 14px;
        color: #8892B0;
        margin-top: 8px;
        font-weight: 400;
      }
      .loading-bar {
        width: 150px;
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        margin-top: 32px;
        overflow: hidden;
      }
      .loading-progress {
        width: 30%;
        height: 100%;
        background: #64D2FF;
        border-radius: 2px;
        animation: loading 1.5s infinite ease-in-out;
      }
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(0.95); opacity: 0.8; }
      }
      @keyframes loading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
    </style>
  </head>
  <body>
    <div class="splash-container">
      <img src="/logo.png" class="logo" alt="Baton Logo" />
      <div class="title">BATON</div>
      <div class="subtitle">Secure Desktop Hub</div>
      <div class="loading-bar">
        <div class="loading-progress"></div>
      </div>
    </div>
  </body>
</html>
