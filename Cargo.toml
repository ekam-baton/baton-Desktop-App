[workspace]
members = [
    "mcp-connector",
    "a2a-router", "baton-tester",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Baton Technologies"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Web framework
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "limit"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }

# Async utilities
futures = "0.3"
async-trait = "0.1"
bytes = "1"

# Tracing / logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Crypto / Auth
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
jsonwebtoken = "9"
sha2 = "0.10"
hex = "0.4"

# Database
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "migrate", "uuid"] }
redis = { version = "0.27", features = ["tokio-comp", "json"] }
deadpool-redis = "0.18"

# Concurrency
dashmap = "6"
governor = "0.7"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"

# Metrics
prometheus = "0.13"
axum-prometheus = "0.7"

# mDNS
mdns-sd = "0.11"

# QR code
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
