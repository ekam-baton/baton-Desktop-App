version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: baton
      POSTGRES_PASSWORD: batonpassword
      POSTGRES_DB: baton
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baton"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  a2a-router:
    build:
      context: .
      dockerfile: a2a-router/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=baton-dev-secret-change-in-production
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  mcp-connector:
    build:
      context: .
      dockerfile: mcp-connector/Dockerfile
    network_mode: "host" # Needs host network for local agent IPC and mDNS
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgres://baton:batonpassword@localhost:5432/baton
      - REDIS_URL=redis://localhost:6379
      - JWT_SECRET=baton-dev-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
