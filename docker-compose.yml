version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: baton
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: baton
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baton"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  a2a-router:
    build:
      context: .
      dockerfile: a2a-router/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-secure-secret-here-minimum-32-chars-long}
      - DATABASE_URL=postgres://baton:${POSTGRES_PASSWORD}@postgres:5432/baton
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  mcp-connector:
    build:
      context: .
      dockerfile: mcp-connector/Dockerfile
    network_mode: "host" # Needs host network for local agent IPC and mDNS
    environment:
      - RUST_LOG=info
      # No DATABASE_URL = uses embedded SQLite (baton.db). Zero config!
      # To use Postgres instead: DATABASE_URL=postgres://user:pass@host/db
      - REDIS_URL=redis://localhost:6379
      - JWT_SECRET=${JWT_SECRET:-your-secure-secret-here-minimum-32-chars-long}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your-refresh-secret-here-minimum-32-chars-long}
      - A2A_ROUTER_URL=ws://127.0.0.1:8080
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
