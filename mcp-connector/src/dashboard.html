<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baton Agent Dashboard</title>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --bg-panel: rgba(20, 20, 25, 0.7);
            --border-glow: rgba(0, 255, 204, 0.3);
            --text-main: #e0e0e0;
            --text-muted: #888;
            --accent: #00ffcc;
            --danger: #ff4444;
            --success: #00ffcc;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 5rem;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 255, 204, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(0, 100, 255, 0.05) 0%, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .request-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .request-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .client-name {
            font-weight: 500;
            font-size: 1.1rem;
        }

        .client-id {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        button {
            background: transparent;
            border: 1px solid;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn-approve {
            border-color: var(--success);
            color: var(--success);
        }

        .btn-approve:hover {
            background: rgba(0, 255, 204, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }

        .btn-deny {
            border-color: var(--danger);
            color: var(--danger);
        }

        .btn-deny:hover {
            background: rgba(255, 68, 68, 0.1);
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.2);
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Baton Connector</h1>
        <p class="subtitle">Agent Access Control Dashboard</p>
        
        <div id="pending-list" class="list-container">
            <!-- Populated via JS -->
            <div class="empty-state">Loading pending requests...</div>
        </div>
    </div>

    <script>
        // Use the browser's native Basic Auth dialog headers (they are sent automatically once logged in)
        
        let pollTimer = null;
        let isUnauthorized = false;
        
        async function fetchPending() {
            if (isUnauthorized) return;
            try {
                const response = await fetch('/admin/api/pending');
                if (response.ok) {
                    const data = await response.json();
                    renderList(data);
                } else if (response.status === 401) {
                    isUnauthorized = true;
                    if (pollTimer) clearInterval(pollTimer);
                    const container = document.getElementById('pending-list');
                    while (container.firstChild) container.removeChild(container.firstChild);
                    const empty = document.createElement('div');
                    empty.className = 'empty-state';
                    empty.textContent = 'Session expired or unauthorized. Please refresh the page to log in.';
                    container.appendChild(empty);
                }
            } catch (err) {
                console.error('Error fetching pending requests', err);
            }
        }

        async function handleAction(event) {
            const btn = event.currentTarget;
            const clientId = btn.dataset.clientId;
            const action = btn.dataset.action;
            if (!clientId || !action) return;
            btn.disabled = true;
            try {
                const res = await fetch(`/admin/api/${action}/${encodeURIComponent(clientId)}`, { method: 'POST' });
                if (res.ok) {
                    fetchPending();
                } else {
                    alert('Action failed: ' + res.status);
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                btn.disabled = false;
            }
        }

        function renderList(requests) {
            const container = document.getElementById('pending-list');
            // Clear safely — removes all child nodes without innerHTML.
            while (container.firstChild) container.removeChild(container.firstChild);

            if (requests.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.textContent = 'No pending authorization requests.';
                container.appendChild(empty);
                return;
            }

            requests.forEach(req => {
                const card = document.createElement('div');
                card.className = 'request-card';

                const info = document.createElement('div');
                info.className = 'info';

                // Use textContent — NEVER innerHTML — to prevent XSS
                const nameEl = document.createElement('div');
                nameEl.className = 'client-name';
                nameEl.textContent = req.device_name || 'Unknown Device';

                const idEl = document.createElement('div');
                idEl.className = 'client-id';
                idEl.textContent = req.client_id;

                info.appendChild(nameEl);
                info.appendChild(idEl);

                const actions = document.createElement('div');
                actions.className = 'actions';

                const denyBtn = document.createElement('button');
                denyBtn.className = 'btn-deny';
                denyBtn.textContent = 'Deny';
                // Use data attribute — never onclick with string interpolation
                denyBtn.dataset.clientId = req.client_id;
                denyBtn.dataset.action = 'deny';
                denyBtn.addEventListener('click', handleAction);

                const approveBtn = document.createElement('button');
                approveBtn.className = 'btn-approve';
                approveBtn.textContent = 'Approve';
                approveBtn.dataset.clientId = req.client_id;
                approveBtn.dataset.action = 'approve';
                approveBtn.addEventListener('click', handleAction);

                actions.appendChild(denyBtn);
                actions.appendChild(approveBtn);

                card.appendChild(info);
                card.appendChild(actions);
                container.appendChild(card);
            });
        }

        // Initial fetch
        fetchPending();
        
        // Poll every 3 seconds
        pollTimer = setInterval(fetchPending, 3000);
    </script>
</body>
</html>
